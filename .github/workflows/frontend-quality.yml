name: Frontend Quality

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/frontend-quality.yml"
      - "index.html"
      - "sitemap.xml"
      - "public-graph.manifest.json"
      - "public-graph.manifest.upstream.json"
      - "public-graph.source-ref.json"
      - "scripts/sync_public_graph.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/frontend-quality.yml"
      - "index.html"
      - "sitemap.xml"
      - "public-graph.manifest.json"
      - "public-graph.manifest.upstream.json"
      - "public-graph.source-ref.json"
      - "scripts/sync_public_graph.mjs"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "pages-build-deployment"
    types:
      - completed

permissions:
  contents: read

jobs:
  script-self-check:
    name: Script Self Check
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run repo-local audits
        run: |
          node scripts/sync_public_graph.mjs --source public-graph.manifest.upstream.json
          node .github/scripts/check_public_graph_parity.mjs --source public-graph.manifest.upstream.json --mirror public-graph.manifest.json --ref public-graph.source-ref.json
          node .github/scripts/check_frontend_public_graph.mjs
          node .github/scripts/frontend_quality_fixtures.mjs
          node .github/scripts/check_frontend_quality.mjs --fixture-self-test
          git diff --exit-code -- index.html sitemap.xml public-graph.manifest.json

  live-quality-gate:
    name: Live Quality Gate
    # Run browser/live checks only after Pages deploys or by manual dispatch.
    # Push/PR events keep the repo-local self checks above, avoiding false failures while
    # GitHub Pages is still serving the previous deployment.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run full quality gate
        # SCPortal and Homepage are independent repositories, so their commit SHAs
        # are intentionally not compared here. The gate verifies that SCPortal
        # publishes a release marker; graph provenance is pinned by source-ref.json.
        run: node .github/scripts/check_frontend_quality.mjs

      - name: Locate latest report
        id: report
        run: |
          latest="$(ls -td .omx/reports/frontend-quality-* | head -1)"
          echo "path=$latest" >> "$GITHUB_OUTPUT"
          echo "### Frontend quality report" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,120p' "$latest/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-quality-report-${{ github.run_id }}
          path: ${{ steps.report.outputs.path }}
          if-no-files-found: error
