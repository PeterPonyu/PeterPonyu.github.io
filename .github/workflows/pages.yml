name: Deploy homepage Pages

on:
  pull_request:
    paths:
      - '.github/public-graph.lock.json'
      - '.github/scripts/**'
      - '.github/workflows/pages.yml'
      - 'assets/**'
      - 'edit-routing-harness/**'
      - 'index.html'
      - 'key-geometry/**'
      - 'noise-swamping/**'
      - 'noise-swamping-wave/**'
      - 'robots.txt'
      - 'scripts/**'
      - 'sitemap.xml'
  push:
    branches:
      - main
    paths:
      - '.github/public-graph.lock.json'
      - '.github/scripts/**'
      - '.github/workflows/pages.yml'
      - 'assets/**'
      - 'edit-routing-harness/**'
      - 'index.html'
      - 'key-geometry/**'
      - 'noise-swamping/**'
      - 'noise-swamping-wave/**'
      - 'robots.txt'
      - 'scripts/**'
      - 'sitemap.xml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify public graph fetch failure fixture
        run: node .github/scripts/fetch_public_graph.mjs --self-test

      - name: Fetch and verify pinned public graph
        run: node .github/scripts/fetch_public_graph.mjs

      - name: Synchronize generated homepage graph
        run: node scripts/sync_public_graph.mjs

      - name: Audit generated homepage graph
        run: node .github/scripts/check_frontend_public_graph.mjs

      - name: Run homepage quality fixtures
        run: |
          node .github/scripts/frontend_quality_fixtures.mjs
          node .github/scripts/check_frontend_quality.mjs --fixture-self-test

      - name: Stage deployable root assets
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          find . -mindepth 1 -maxdepth 1 -type f \
            \( -name '*.htm' -o -name '*.html' -o -name '*.ico' -o -name '*.txt' -o -name '*.webmanifest' -o -name '*.xml' \) \
            -exec cp -a {} _site/ \;
          find . -mindepth 1 -maxdepth 1 -type d \
            ! -name .agents ! -name .cache ! -name .claude ! -name .cloud ! -name .codex ! -name .cursor ! -name .git ! -name .github ! -name .omc ! -name .omx ! -name .superpowers ! -name _site ! -name node_modules ! -name scripts \
            -exec cp -a {} _site/ \;
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          ! find _site -type d \( -name .agents -o -name .cache -o -name .claude -o -name .cloud -o -name .codex -o -name .cursor -o -name .git -o -name .github -o -name .omc -o -name .omx -o -name .superpowers -o -name node_modules -o -name scripts \) -print -quit | grep -q .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
